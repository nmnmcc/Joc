name: Joc

options:
  bundleIdPrefix: cc.nmnm
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
    watchOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Joc:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    dependencies:
      - target: JocControl
        embed: true
      - target: JocWatch
    copyFiles:
      - destination: watch
        files:
          - target: JocWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.nmnm.joc
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements/Joc.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Joc
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2"

  JocControl:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Controls
        excludes:
          - JocWatchControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.nmnm.joc.control
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements/Joc.entitlements
        INFOPLIST_FILE: Sources/Controls/JocWidgetExtension-Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1,2"

  JocWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Shared
      - path: Sources/Watch
        excludes:
          - JocWatchControl.swift
    dependencies:
      - target: JocWatchControl
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.nmnm.joc.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements/Joc.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Joc
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cc.nmnm.joc
        INFOPLIST_KEY_WKWatchKitApp: true
        TARGETED_DEVICE_FAMILY: "4"

  JocWatchControl:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/Shared
      - path: Sources/Controls
        excludes:
          - JocControl.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.nmnm.joc.watchkitapp.control
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements/Joc.entitlements
        INFOPLIST_FILE: Sources/Controls/JocWidgetExtension-Info.plist
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "4"

  JocMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.nmnm.joc
        CODE_SIGN_ENTITLEMENTS: Sources/Entitlements/JocMac.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Joc
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSSupportsAutomaticTermination: false
        INFOPLIST_KEY_NSSupportsSuddenTermination: false
        MACOSX_DEPLOYMENT_TARGET: "14.0"
